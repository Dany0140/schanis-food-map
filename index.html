<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Track meals, water intake, and how foods make you feel.">
  <title>Schani's Food Map - Track Allergies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- ?v= is bumped on release so GitHub Pages caching can't pair an old
       app.js/style.css with a new index.html. -->
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <div class="container" role="main">
    <header>
      <div class="header-decoration" aria-hidden="true">🎀🐱💖</div>
      <h1>~ Schani's Food Map ~</h1>
      <p class="subtitle"></p>
      <div class="header-actions">
        <button class="btn-text" id="import-btn" aria-label="Import data from file">Import Data</button>
        <button class="btn-text" id="export-btn" aria-label="Export data to file">Export Data</button>
        <input type="file" id="import-file" accept=".json" hidden>
      </div>
    </header>

    <!-- Navigation -->
    <nav class="tab-nav" aria-label="Main navigation">
      <a href="#today" class="tab-link active" data-page="today">Today</a>
      <a href="#diary" class="tab-link" data-page="diary">Diary</a>
      <a href="#analytics" class="tab-link" data-page="analytics">Analytics</a>
    </nav>

    <!-- Page: Today -->
    <div id="page-today" class="page active">
      <div class="quick-actions">
        <div class="quick-group" aria-label="Daily poop tracker">
          <span class="quick-emoji" aria-hidden="true">💩</span>
          <span id="poop-count">0</span>
          <div class="quick-controls">
            <button class="quick-plus" id="poop-plus" aria-label="Add poop">+</button>
            <button class="quick-minus" id="poop-minus" aria-label="Remove poop">&minus;</button>
          </div>
        </div>
        <div class="quick-group" aria-label="Daily water tracker">
          <span class="quick-emoji" aria-hidden="true">🥛</span>
          <span id="water-total">0L</span>
          <div class="quick-controls">
            <button class="quick-plus" id="water-plus" aria-label="Add 0.5L water">+</button>
            <button class="quick-minus" id="water-minus" aria-label="Remove 0.5L water">&minus;</button>
          </div>
        </div>
      </div>

      <div class="card stress-card" id="stress-today" aria-label="Stress level for today"></div>

      <div class="card">
        <form id="meal-form">
          <div class="form-group">
            <label for="meal-name">Meal name</label>
            <input type="text" id="meal-name" placeholder="e.g., Breakfast burrito" required>
          </div>
          <div class="form-group">
            <label for="meal-ingredients">Ingredients (comma-separated)</label>
            <input type="text" id="meal-ingredients" placeholder="e.g., eggs, cheese, tortilla">
          </div>
          <div class="form-group">
            <label for="meal-feeling">How did you feel?</label>
            <div class="feeling-slider">
              <input type="range" id="meal-feeling" min="1" max="5" value="3" aria-valuemin="1" aria-valuemax="5" aria-valuenow="3">
              <div class="feeling-display" aria-live="polite">
                <span class="feeling-emoji" id="feeling-emoji">😐</span>
                <span class="feeling-label" id="feeling-label">Okay</span>
              </div>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="meal-date">Date</label>
              <input type="date" id="meal-date">
            </div>
            <div class="form-group">
              <label for="meal-time">Time</label>
              <input type="time" id="meal-time">
            </div>
          </div>
          <div class="form-group">
            <label for="meal-notes">Notes (optional)</label>
            <input type="text" id="meal-notes" placeholder="Any additional notes...">
          </div>
          <button type="submit" class="btn btn-primary">Save Meal</button>
        </form>
      </div>

      <div id="meal-list" aria-label="Today's meals"></div>
    </div>

    <!-- Page: Diary -->
    <div id="page-diary" class="page">
      <div class="diary-nav">
        <button class="btn-icon" id="diary-prev" aria-label="Previous day">&larr;</button>
        <input type="date" id="diary-date" class="diary-date-input">
        <button class="btn-icon" id="diary-next" aria-label="Next day">&rarr;</button>
      </div>
      <div class="diary-summary" id="diary-summary"></div>
      <div class="card stress-card" id="stress-diary" aria-label="Stress level for selected day"></div>
      <div id="diary-meals" aria-label="Meals for selected day"></div>
    </div>

    <!-- Page: Analytics -->
    <div id="page-analytics" class="page">
      <div class="analytics-range">
        <button class="range-btn active" data-range="7">7 days</button>
        <button class="range-btn" data-range="30">30 days</button>
        <button class="range-btn" data-range="all">All time</button>
      </div>
      <div class="card chart-card">
        <h2 class="chart-title">Feeling Trend</h2>
        <canvas id="chart-feeling"></canvas>
      </div>
      <div class="card chart-card">
        <h2 class="chart-title">Water & Poop</h2>
        <canvas id="chart-tracking"></canvas>
      </div>
      <div class="card chart-card">
        <h2 class="chart-title">Ingredient ↔ Feeling</h2>
        <p class="chart-subtitle">Ingredients with 3+ meals</p>
        <canvas id="chart-ingredients"></canvas>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
