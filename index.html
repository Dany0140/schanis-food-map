<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schani's Food Map - Track Allergies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FFF0F3;
      --card-bg: #FFFFFF;
      --primary: #FFB7C5;
      --primary-light: #FFD4DC;
      --primary-dark: #F48FB1;
      --secondary: #FFE4E9;
      --accent-bad: #FF9E9E;
      --accent-good: #A8E6CF;
      --accent-warn: #FFE5A0;
      --text-primary: #5A5A5A;
      --text-secondary: #8B7D7D;
      --border: #FFE0E6;
      --shadow: rgba(255, 183, 197, 0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Quicksand", system-ui, sans-serif;
      background: var(--bg);
      background-image: 
        radial-gradient(circle at 20% 20%, rgba(255, 212, 220, 0.4) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(255, 183, 197, 0.3) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.6) 0%, transparent 70%);
      color: var(--text-primary);
      min-height: 100vh;
      font-size: 16px;
      line-height: 1.6;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    h1 {
      font-family: "Fredoka", cursive;
      font-weight: 600;
      font-size: 36px;
      color: var(--primary-dark);
      margin-bottom: 4px;
      text-shadow: 2px 2px 0px rgba(255, 183, 197, 0.4);
    }

    .header-decoration {
      font-size: 32px;
      margin-bottom: 8px;
      animation: wiggle 3s ease-in-out infinite;
    }

    @keyframes wiggle {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }

    .header-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 12px;
    }

    .btn-text {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      color: var(--primary);
      cursor: pointer;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 12px;
      transition: all 0.2s;
    }

    .btn-text:hover {
      background: var(--primary-light);
      color: var(--primary-dark);
    }

    .quick-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 16px;
    }

    .quick-emoji {
      font-size: 28px;
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 8px 14px;
      display: inline-block;
      box-shadow: 0 2px 8px var(--shadow);
    }

    #water-total {
      font-weight: 600;
      color: var(--primary-dark);
      font-size: 14px;
    }

    .quick-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .quick-controls {
      display: flex;
      gap: 4px;
    }

    .quick-plus, .quick-minus {
      font-size: 18px;
      font-weight: 600;
      background: var(--primary-light);
      border: none;
      border-radius: 8px;
      width: 28px;
      height: 24px;
      cursor: pointer;
      color: var(--primary-dark);
      transition: all 0.2s;
    }

    .quick-plus:hover, .quick-minus:hover {
      background: var(--primary);
      color: white;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 15px;
      font-weight: 500;
    }

    .card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 
        0 4px 20px var(--shadow),
        0 0 0 2px var(--border);
      border: 2px solid var(--border);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group:last-of-type {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--primary-dark);
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    input[type="text"],
    input[type="date"] {
      width: 100%;
      padding: 14px 16px;
      font-family: inherit;
      font-size: 15px;
      border: 2px solid var(--border);
      border-radius: 16px;
      background: #FFF9FA;
      color: var(--text-primary);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(255, 105, 180, 0.15);
    }

    .feeling-slider {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 0;
    }

    input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 8px;
      background: linear-gradient(90deg, var(--accent-bad), var(--accent-warn), var(--accent-good));
      border-radius: 4px;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.15s;
      box-shadow: 0 2px 8px rgba(255, 183, 197, 0.4);
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    .feeling-display {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 80px;
    }

    .feeling-emoji {
      font-size: 28px;
      flex-shrink: 0;
    }

    .feeling-label {
      font-size: 14px;
      font-weight: 600;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 28px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      width: 100%;
      box-shadow: 0 4px 15px rgba(255, 183, 197, 0.35);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 183, 197, 0.45);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
    }

    .empty-state-icon {
      font-size: 56px;
      margin-bottom: 12px;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .meal-item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 18px;
      background: var(--card-bg);
      border-radius: 20px;
      border: 2px solid var(--border);
      margin-bottom: 14px;
      box-shadow: 0 2px 10px var(--shadow);
      transition: transform 0.2s;
    }

    .meal-item:hover {
      transform: scale(1.02);
    }

    .meal-feeling {
      font-size: 32px;
      flex-shrink: 0;
    }

    .meal-content {
      flex: 1;
      min-width: 0;
    }

    .meal-name {
      font-weight: 600;
      font-size: 17px;
      margin-bottom: 6px;
      color: var(--primary-dark);
    }

    .meal-ingredients {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }

    .ingredient-tag {
      display: inline-block;
      padding: 5px 14px;
      font-size: 13px;
      font-weight: 500;
      background: linear-gradient(135deg, #FFF0F3, #FFE4E9);
      border-radius: 20px;
      color: var(--primary-dark);
      border: 1px solid var(--border);
    }

    .meal-date {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .meal-delete {
      background: none;
      border: none;
      font-size: 18px;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 4px;
      opacity: 0.6;
      transition: opacity 0.2s, color 0.2s;
    }

    .meal-delete:hover {
      opacity: 1;
      color: var(--accent-bad);
    }

    .feeling-great { color: #4CAF4F; }
    .feeling-good { color: #7DD87D; }
    .feeling-okay { color: #FFD93D; }
    .feeling-bad { color: #FF9B9B; }
    .feeling-terrible { color: #FF6B6B; }

    @media (max-width: 400px) {
      .container {
        padding: 16px 12px 40px;
      }
      
      h1 {
        font-size: 24px;
      }

      .meal-item {
        padding: 12px;
      }

      .meal-feeling {
        font-size: 24px;
      }

      input[type="date"] {
        padding: 10px 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-decoration">🎀🐱💖</div>
      <h1>~ Schani's Food Map ~</h1>
      <p class="subtitle">Track what you eat, discover what hurts</p>
      <div class="header-actions">
        <button class="btn-text" id="export-btn">Export Data</button>
        <button class="btn-text" id="import-btn">Import Data</button>
        <input type="file" id="import-file" accept=".json" style="display:none">
      </div>
      <div class="quick-actions">
        <div class="quick-group">
          <span class="quick-emoji">💩</span>
          <span id="poop-count">0</span>
          <div class="quick-controls">
            <button class="quick-plus" id="poop-plus">+</button>
            <button class="quick-minus" id="poop-minus">−</button>
          </div>
        </div>
        <div class="quick-group">
          <span class="quick-emoji">🥛</span>
          <span id="water-total">0L</span>
          <div class="quick-controls">
            <button class="quick-plus" id="water-plus">+</button>
            <button class="quick-minus" id="water-minus">−</button>
          </div>
        </div>
      </div>
    </header>

    <div class="card">
      <form id="meal-form">
        <div class="form-group">
          <label for="meal-name">Meal name</label>
          <input type="text" id="meal-name" placeholder="e.g., Breakfast burrito" required>
        </div>
        <div class="form-group">
          <label for="meal-ingredients">Ingredients (comma-separated)</label>
          <input type="text" id="meal-ingredients" placeholder="e.g., eggs, cheese, tortilla">
        </div>
        <div class="form-group">
          <label>How did you feel?</label>
          <div class="feeling-slider">
            <input type="range" id="meal-feeling" min="1" max="5" value="3">
            <div class="feeling-display">
              <span class="feeling-emoji" id="feeling-emoji">😐</span>
              <span class="feeling-label" id="feeling-label">Okay</span>
            </div>
          </div>
        </div>
        <div class="form-group">
          <label for="meal-date">Date</label>
          <input type="date" id="meal-date">
        </div>
        <button type="submit" class="btn btn-primary">Save Meal</button>
      </form>
    </div>

    <div id="meal-list"></div>
  </div>

  <script>
    const STORAGE_KEY = 'foodmap_meals';
    const POOPED_KEY = 'foodmap_pooped';
    const WATER_KEY = 'foodmap_water';
    const POOP_COUNT_KEY = 'foodmap_poop_count';
    const POOP_DATE_KEY = 'foodmap_poop_date';

    const feelingConfig = {
      1: { emoji: '😿', label: 'Terrible', class: 'feeling-terrible' },
      2: { emoji: '😟', label: 'Bad', class: 'feeling-bad' },
      3: { emoji: '😐', label: 'Okay', class: 'feeling-okay' },
      4: { emoji: '😊', label: 'Good', class: 'feeling-good' },
      5: { emoji: '🥰', label: 'Great', class: 'feeling-great' }
    };

    let meals = [];
    let pooped = [];
    let waterDrank = 0;
    let dailyPoopCount = 0;

    function loadMeals() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        meals = JSON.parse(saved);
      }
    }

    function saveMeals() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(meals));
    }

    function loadTracking() {
      const poopSaved = localStorage.getItem(POOPED_KEY);
      if (poopSaved) {
        pooped = JSON.parse(poopSaved);
      }
      const waterSaved = localStorage.getItem(WATER_KEY);
      if (waterSaved) {
        waterDrank = parseFloat(waterSaved);
      }

      const today = new Date().toISOString().split('T')[0];
      const savedDate = localStorage.getItem(POOP_DATE_KEY);
      const savedCount = localStorage.getItem(POOP_COUNT_KEY);

      if (savedDate === today && savedCount) {
        dailyPoopCount = parseInt(savedCount);
      } else {
        dailyPoopCount = 0;
      }
      updatePoopDisplay();
      updateWaterDisplay();
    }

    function saveTracking() {
      localStorage.setItem(POOPED_KEY, JSON.stringify(pooped));
      localStorage.setItem(WATER_KEY, waterDrank.toString());
      localStorage.setItem(POOP_DATE_KEY, new Date().toISOString().split('T')[0]);
      localStorage.setItem(POOP_COUNT_KEY, dailyPoopCount.toString());
    }

    function updateWaterDisplay() {
      document.getElementById('water-total').textContent = waterDrank + 'L';
    }

    function updatePoopDisplay() {
      document.getElementById('poop-count').textContent = dailyPoopCount;
    }

    function extractIngredients(ingredientString) {
      if (!ingredientString) return [];
      return ingredientString
        .split(',')
        .map(i => i.trim())
        .filter(i => i.length > 0);
    }

    function formatDate(isoString) {
      const date = new Date(isoString);
      return date.toLocaleDateString('en-US', { 
        month: 'short', 
        day: 'numeric',
        year: date.getFullYear() !== new Date().getFullYear() ? 'numeric' : undefined
      });
    }

    document.getElementById('meal-date').value = new Date().toISOString().split('T')[0];

    const feelingSlider = document.getElementById('meal-feeling');
    const feelingEmoji = document.getElementById('feeling-emoji');
    const feelingLabel = document.getElementById('feeling-label');

    function updateFeelingDisplay(value) {
      const config = feelingConfig[value];
      feelingEmoji.textContent = config.emoji;
      feelingLabel.textContent = config.label;
      feelingLabel.className = 'feeling-label ' + config.class;
    }

    feelingSlider.addEventListener('input', (e) => {
      updateFeelingDisplay(e.target.value);
    });

    updateFeelingDisplay(3);

    document.getElementById('meal-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('meal-name').value.trim();
      const ingredients = document.getElementById('meal-ingredients').value.trim();
      const feeling = parseInt(feelingSlider.value);
      const date = document.getElementById('meal-date').value;

      const meal = {
        id: Date.now().toString(),
        name,
        ingredients,
        feeling,
        date
      };

      meals.unshift(meal);
      saveMeals();
      renderMeals();

      document.getElementById('meal-name').value = '';
      document.getElementById('meal-ingredients').value = '';
      feelingSlider.value = 3;
      updateFeelingDisplay(3);
      document.getElementById('meal-date').value = new Date().toISOString().split('T')[0];
    });

    function renderMeals() {
      const list = document.getElementById('meal-list');
      
      if (meals.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">🍽️</div>
            <p>No meals tracked yet~<br>Add your first meal above!</p>
          </div>
        `;
        return;
      }

      const sorted = [...meals].sort((a, b) => new Date(b.date) - new Date(a.date));

      list.innerHTML = sorted.map(meal => {
        const config = feelingConfig[meal.feeling];
        const ingredientList = extractIngredients(meal.ingredients);

        return `
          <div class="meal-item">
            <div class="meal-feeling">${config.emoji}</div>
            <div class="meal-content">
              <div class="meal-name">${meal.name}</div>
              ${ingredientList.length > 0 ? `
                <div class="meal-ingredients">
                  ${ingredientList.map(i => `<span class="ingredient-tag">${i}</span>`).join('')}
                </div>
              ` : ''}
              <div class="meal-date">${formatDate(meal.date)}</div>
            </div>
            <button class="meal-delete" data-id="${meal.id}">×</button>
          </div>
        `;
      }).join('');

      list.querySelectorAll('.meal-delete').forEach(btn => {
        btn.addEventListener('click', () => {
          meals = meals.filter(m => m.id !== btn.dataset.id);
          saveMeals();
          renderMeals();
        });
      });
    }

    loadMeals();
    renderMeals();
    loadTracking();

    document.getElementById('poop-plus').addEventListener('click', () => {
      pooped.push(new Date().toISOString());
      dailyPoopCount++;
      saveTracking();
      updatePoopDisplay();
    });

    document.getElementById('poop-minus').addEventListener('click', () => {
      if (dailyPoopCount > 0) {
        dailyPoopCount--;
        const today = new Date().toISOString().split('T')[0];
        const lastPoopIndex = pooped.findIndex(p => p.startsWith(today));
        if (lastPoopIndex !== -1) {
          pooped.splice(lastPoopIndex, 1);
        }
        saveTracking();
        updatePoopDisplay();
      }
    });

    document.getElementById('water-plus').addEventListener('click', () => {
      waterDrank += 0.5;
      saveTracking();
      updateWaterDisplay();
    });

    document.getElementById('water-minus').addEventListener('click', () => {
      if (waterDrank >= 0.5) {
        waterDrank -= 0.5;
        saveTracking();
        updateWaterDisplay();
      }
    });

    document.getElementById('export-btn').addEventListener('click', () => {
      const exportData = {
        version: 1,
        exportedAt: new Date().toISOString(),
        meals: meals,
        pooped: pooped,
        waterDrank: waterDrank
      };
      const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `foodmap-${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById('import-btn').addEventListener('click', () => {
      document.getElementById('import-file').click();
    });

    document.getElementById('import-file').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const data = JSON.parse(event.target.result);
          if (data.meals && Array.isArray(data.meals)) {
            meals = data.meals;
            saveMeals();
            renderMeals();
          }
          if (data.pooped && Array.isArray(data.pooped)) {
            pooped = data.pooped;
          }
          if (typeof data.waterDrank === 'number') {
            waterDrank = data.waterDrank;
          }
          saveTracking();
          updateWaterDisplay();
          alert('Data imported successfully!');
        } catch (err) {
          alert('Error reading file');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    });
  </script>
</body>
</html>
